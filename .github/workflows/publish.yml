name: Publish

# Runs when `npm run release` pushes a vX.Y.Z tag. Publishes to npm with
# trusted publishing (OIDC, no token) and creates a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # GitHub release
  id-token: write # npm trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@11

      - name: Tag must match package.json
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($PKG)"; exit 1
          fi

      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate:registry
      - run: npm run build

      - run: npm publish --access public

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v tag="## $GITHUB_REF_NAME " 'index($0, tag)==1 {p=1; next} /^## v/ {p=0} p' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
