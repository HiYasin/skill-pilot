name: Compatibility

# After CI passes on main: run the tests and a real install on every OS,
# downloading skill files from this exact commit (not the local copy).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compat:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build

      - name: Install skills into a fake Next.js project
        shell: bash
        env:
          SKILL_PILOT_IGNORE_LOCAL_REGISTRY: "1"
          SKILL_PILOT_REGISTRY_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.workflow_run.head_sha || github.sha }}/registry/skills
          SKILL_PILOT_CACHE_DIR: ${{ runner.temp }}/skill-cache
        run: |
          mkdir -p "$RUNNER_TEMP/app"
          echo '{ "dependencies": { "next": "15.0.0", "react": "19.0.0", "@prisma/client": "6.0.0" } }' > "$RUNNER_TEMP/app/package.json"
          cd "$RUNNER_TEMP/app"
          node "$GITHUB_WORKSPACE/bin.mjs" -y --verbose -a claude-code
          test -f .agents/skills/nextjs-app-router/SKILL.md
          test -f .claude/skills/nextjs-app-router/SKILL.md
          test -f skills-lock.json
